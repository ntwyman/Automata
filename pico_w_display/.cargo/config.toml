[target.'cfg(all(target_arch = "arm", target_os = "none"))']
runner = "probe-rs run --chip RP235x"
# runner = "picotool load --update --verify --execute -t elf"

[build]
target = "thumbv8m.main-none-eabihf"

[env]
# cyw43 stays at info: at debug it dumps every ioctl/iovar payload, and the
# `WIFI` join's `SetWsecPmk`/`sae_password` payloads are the plaintext
# password, defeating `protocol.rs`'s own `recv: WIFI <redacted>`. Lower it
# locally (`DEFMT_LOG=debug cargo run ...`) only when debugging the chip.
# trouble-host stays at warn for the same reason: at info and debug it logs
# the bonded peer's `Identity`, IRK included, on every connect and reconnect.
# It has to be the whole crate — defmt only honours a submodule entry
# stricter than its crate's level when that entry is `off`.
DEFMT_LOG = "debug,cyw43=info,trouble_host=warn"
