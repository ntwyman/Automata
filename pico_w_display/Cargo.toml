[package]
edition = "2024"
name = "pico_w_display"
version = "0.1.0"
authors = ["Nick Twyman <nick@conky.org>"]
resolver = "2"

[lib]
name = "pico_w_display"

[[bin]]
name = "pico_w_display"
test = false
bench = false

# Portable: needed by `protocol` (and so by both the host-testable `[lib]`
# and the on-device `[[bin]]`), and buildable for any target.
[dependencies]
defmt = "1.0.1"

embedded-hal = "1.0.0"
embedded-hal-async = "1.0.0"
embedded-io = "0.7.1"
embedded-io-async = "0.7.0"
embedded-storage = "0.3.1"

embassy-sync = "0.8.0"
smart-leds = "0.4.0"
embassy-futures = "0.1.2"
heapless = "0.9.3"

# Bare-metal only (`target_os = "none"`): chip/board bring-up, the RTT
# logger, and the panic handler. None of this is reachable from `protocol`,
# so it never needs to build for the host `cargo test` target — and mostly
# can't (`embassy-rp`'s `critical-section-impl` conflicts with the host-only
# `critical-section` impl below if both end up in the same build).
#
# `embassy-sync`/`heapless`'s `defmt` feature is enabled only here, not
# above: on-device it wires their internal logging/formatting to defmt as
# before; adding it for the host build would pull in calls to defmt's global
# logger (`defmt-rtt`, itself device-only) with nothing to link against.
[target.'cfg(target_os = "none")'.dependencies]
embassy-sync = { version = "0.8.0", features = ["defmt"] }
heapless = { version = "0.9.3", features = ["defmt"] }

defmt-rtt = "1.0.0"
panic-probe = { version = "1.0.0", features = ["print-defmt"] }

cortex-m-rt = "0.7.5"
cortex-m = { version = "0.7.7" }

embassy-executor = { version = "0.10.0", features = [
    "platform-cortex-m",
    "executor-thread",
    "defmt",
    "executor-interrupt",
] }
embassy-time = { version = "0.5.1", features = [
    "defmt",
    "defmt-timestamp-uptime",
] }
embassy-rp = { version = "0.10.0", features = [
    "defmt",
    "unstable-pac",
    "time-driver",
    "critical-section-impl",
    "rp235xa",
] }
embassy-usb = { version = "0.6.0", features = ["defmt"] }

cyw43 = { version = "0.7.0", features = ["defmt"] }
cyw43-pio = { version = "0.10.0", features = ["defmt"] }
embassy-net = { version = "0.9.1", features = [
    "defmt",
    "dhcpv4",
    "medium-ethernet",
] }
static_cell = "2.1.1"

[dev-dependencies]
# Host-only: `CriticalSectionRawMutex` needs a registered critical-section
# implementation to link; on-device that's `embassy-rp`'s, on the host it's
# this one. `pollster` blocks on the async fns under test with no reactor,
# since the fakes in these tests never actually suspend on real I/O.
critical-section = { version = "1.1", features = ["std"] }
pollster = "0.4"

[profile.release]
debug = 2
lto = true
opt-level = 'z'

[profile.dev]
debug = 2
lto = true
opt-level = "z"

# `cargo test --target <host-triple> --profile host-test --lib` (there's no
# default host target since `.cargo/config.toml` pins the on-device one).
# `[profile.dev]`'s `lto = true` + `debug = 2` combination is a device-size
# optimization that also triggers a macOS linker "too many sections" failure
# on host test binaries; this profile is `dev` without those two overrides.
[profile.host-test]
inherits = "dev"
lto = false
opt-level = 0
